<style>
/* Layout: operations-console feel. Wide hero with a sample profit panel, then ruled sections that read like a fleet report. */
:root{
  --bg:#F5F9F7; --fg:#10261F; --muted:#52665E; --line:#D3E2DB; --card:#FFFFFF;
  --accent:#0B6F61; --accent-ink:#FFFFFF; --mint:#E3F2EC; --deep:#0F2A2E; --deep-fg:#E8F4EF; --deep-muted:#9DB8AF;
  --warn:#9A5B00; --warn-bg:#FBF0DC; --bad:#B3261E;
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1714; --fg:#E6F1EC; --muted:#9DB3AA; --line:#1F332D; --card:#11221D;
  --accent:#3FBF9F; --accent-ink:#06211A; --mint:#12302A; --deep:#0A1F22; --deep-fg:#E8F4EF; --deep-muted:#8FAEA4;
  --warn:#F0B35A; --warn-bg:#2E2411; --bad:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1714; --fg:#E6F1EC; --muted:#9DB3AA; --line:#1F332D; --card:#11221D;
  --accent:#3FBF9F; --accent-ink:#06211A; --mint:#12302A; --deep:#0A1F22; --deep-fg:#E8F4EF; --deep-muted:#8FAEA4;
  --warn:#F0B35A; --warn-bg:#2E2411; --bad:#FF8A80; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
:lang(ar) h1,:lang(ar) h2,:lang(ar) h3{letter-spacing:0;line-height:1.3}
p{margin:0}
a{color:inherit}
.wrap{max-width:1120px;margin-inline:auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}

/* header */
header{display:flex;align-items:center;gap:20px;padding-block:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;text-decoration:none}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
nav{display:flex;gap:22px;margin-inline-start:auto;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);font-size:15px;font-weight:500}
nav a:hover{color:var(--fg)}
.tools{display:flex;gap:8px}
.btn{font:600 15px var(--body);border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:7px 14px;font-size:14px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:48px 56px}
.eyebrow{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
:lang(ar) .eyebrow{letter-spacing:0;text-transform:none;font-size:14px}
.hero h1{font-size:clamp(36px,5.4vw,60px);margin-block:14px 18px;font-weight:700}
.hero p.lead{font-size:18px;color:var(--muted);max-width:56ch}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}

.panel{background:var(--deep);color:var(--deep-fg);border-radius:18px;padding:22px;min-width:0;box-shadow:0 18px 50px -24px rgba(8,30,26,.55)}
.panel .tag{display:flex;justify-content:space-between;font-size:12px;color:var(--deep-muted);margin-bottom:14px;gap:10px}
.panel h3{font-size:16px;font-weight:600;margin-bottom:12px;font-family:var(--body)}
.row{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid rgba(255,255,255,.1);font-size:15px}
.row b{font-variant-numeric:tabular-nums;font-weight:600;direction:ltr;unicode-bidi:isolate}
.row.total{border-bottom:0;font-size:17px;padding-top:14px}
.row.total b{color:#6FE0C0;font-size:24px;font-family:var(--display)}
.alerts{margin-top:14px;display:grid;gap:8px}
.alert{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:#F0B35A;margin-top:7px;flex:none}
.dot.g{background:#6FE0C0}

/* sections */
section{padding-block:60px;border-top:1px solid var(--line)}
.head{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;margin-bottom:36px;align-items:end}
.head h2{font-size:clamp(28px,3.6vw,42px);font-weight:700}
.head p{color:var(--muted);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.stat{padding:26px 28px;min-width:0}
.stat + .stat{border-inline-start:1px solid var(--line)}
.stat .n{font:700 clamp(34px,4.4vw,52px)/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.stat .n{direction:ltr;unicode-bidi:isolate;text-align:start}
:lang(ar) .stat .n{text-align:right}
.stat .l{margin-top:10px;font-weight:500}
.stat .s{color:var(--muted);font-size:14px;margin-top:2px}
.src{color:var(--muted);font-size:13px;margin-top:14px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card h3{font-size:19px;font-weight:600;margin-bottom:8px}
.card p{color:var(--muted);font-size:15px}
.note{margin-top:22px;background:var(--mint);border-radius:12px;padding:16px 20px;font-size:15px}

.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.mod .ic{width:42px;height:42px;border-radius:11px;background:var(--mint);display:grid;place-items:center;margin-bottom:16px}
.mod .ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mod h3{font-size:20px;font-weight:600;margin-bottom:6px}
.mod p{color:var(--muted);font-size:15px}
.mod.wide{grid-column:span 2;background:var(--deep);color:var(--deep-fg);border-color:transparent}
.mod.wide p{color:var(--deep-muted)}
.mod.wide .ic{background:rgba(255,255,255,.1)}
.mod.wide .ic svg{stroke:#6FE0C0}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:s}
.step{position:relative;padding:0 18px 0 0;min-width:0}
:lang(ar) .step{padding:0 0 0 18px}
.step .no{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px var(--display);margin-bottom:14px;position:relative;z-index:1}
.step::before{content:"";position:absolute;top:18px;inset-inline:36px 0;height:2px;background:var(--line)}
.step:last-child::before{display:none}
.step h3{font-size:18px;margin-bottom:6px;font-weight:600}
.step p{font-size:14.5px;color:var(--muted)}
.flow{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:15px;color:var(--muted)}

/* calculator */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
.calc label{display:block;font-weight:500;margin-bottom:6px}
.calc .ctl{margin-bottom:22px}
.calc output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.out{background:var(--mint);border-radius:14px;padding:24px;min-width:0}
.out .big{font:700 clamp(30px,4vw,44px)/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.out .lbl{color:var(--muted);font-size:14px;margin-bottom:4px}
.out .sep{height:1px;background:var(--line);margin-block:18px}
.out .loss{color:var(--bad)}

.why{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.why > div{padding:24px 28px;min-width:0;border-bottom:1px solid var(--line)}
.why > div:nth-child(odd){border-inline-end:1px solid var(--line)}
.why > div:last-child{grid-column:1/-1;border-bottom:0;background:var(--mint)}
.why h3{font-size:19px;font-weight:600;margin-bottom:6px}
.why p{color:var(--muted);font-size:15px}
.why > div:last-child p{color:var(--fg)}

.v2030{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.v2030 .card{padding:20px}
.v2030 h3{font-size:17px}

.people{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.person{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 14px var(--display);flex:none}
.person b{display:block;font-weight:600;line-height:1.3}
.person span{font-size:14px;color:var(--muted)}
.person.open .av{background:transparent;color:var(--accent);border:1.5px dashed var(--accent)}

.contact{background:var(--deep);color:var(--deep-fg);border-radius:20px;padding:44px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;margin-block:10px 0}
.contact h2{font-size:clamp(28px,3.6vw,40px);font-weight:700}
.contact p{color:var(--deep-muted);margin-top:10px;max-width:50ch}
.mail{background:rgba(255,255,255,.08);border-radius:14px;padding:20px;min-width:0}
.mail small{display:block;color:var(--deep-muted);margin-bottom:6px}
.mail code{font:600 17px var(--body);word-break:break-all;user-select:all;display:block;margin-bottom:14px}
.mail .btn{background:#6FE0C0;border-color:#6FE0C0;color:#06211A}
.mail .btn.ghost{background:transparent;color:var(--deep-fg);border-color:rgba(255,255,255,.3)}
.mail .acts{display:flex;gap:8px;flex-wrap:wrap}

footer{padding-block:30px 40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer .legal{max-width:70ch}

@media (max-width:960px){
  .hero,.head,.calc,.contact{grid-template-columns:1fr}
  .grid4,.mods{grid-template-columns:repeat(2,1fr)}
  .grid5,.v2030{grid-template-columns:repeat(2,1fr)}
  .mod.wide{grid-column:span 2}
  .steps{grid-template-columns:1fr;gap:22px}
  .step::before{display:none}
  .people{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:620px){
  nav{order:3;width:100%;margin:0;gap:16px}
  .stats,.why{grid-template-columns:1fr}
  .stat + .stat{border-inline-start:0;border-top:1px solid var(--line)}
  .why > div:nth-child(odd){border-inline-end:0}
  .grid4,.mods,.grid5,.v2030,.people{grid-template-columns:1fr}
  .mod.wide{grid-column:auto}
  .contact{padding:28px}
  .calc{padding:20px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

var lang="en";
try{var s=localStorage.getItem("lang");if(s==="ar"||s==="en")lang=s}catch(e){}
function fmt(n){return Math.round(n).toLocaleString(lang==="ar"?"en-US":"en-US")}
function render(){
  var d=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(el){var v=d[el.getAttribute("data-i")];if(typeof v==="string")el.textContent=v});
  document.getElementById("lang").textContent=lang==="ar"?"English":"العربية";
  calc();
}
function calc(){
  var d=T[lang],r=+document.getElementById("riders").value,l=+document.getElementById("leak").value;
  var per=8558-7446,c=r*per,loss=r*8558*l/100;
  document.getElementById("ridersOut").textContent=fmt(r);
  document.getElementById("leakOut").textContent=l;
  var cur=d.cur;
  document.getElementById("contrib").textContent=lang==="ar"?fmt(c)+" "+cur:cur+" "+fmt(c);
  document.getElementById("loss").textContent=lang==="ar"?fmt(loss)+" "+cur:cur+" "+fmt(loss);
  document.getElementById("share").textContent=d.ca_share((c?loss/c*100:0).toFixed(1));
}
document.getElementById("lang").addEventListener("click",function(){
  lang=lang==="en"?"ar":"en";try{localStorage.setItem("lang",lang)}catch(e){}render()});
document.getElementById("riders").addEventListener("input",calc);
document.getElementById("leak").addEventListener("input",calc);
document.getElementById("copy").addEventListener("click",function(){
  var b=this,t=document.getElementById("email").textContent;
  function done(){var o=T[lang].co_copy;b.textContent=T[lang].co_copied;setTimeout(function(){b.textContent=T[lang].co_copy},1500)}
  function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById("email"));var s=getSelection();s.removeAllRanges();s.addRange(r)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,sel)}else{sel()}
});
render();
</script>
